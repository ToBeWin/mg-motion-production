<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>START / READY · 可运行交互组件</title>
<style>*{box-sizing:border-box}body{background:#f5f4ef;color:#193438;font:18px system-ui;margin:0;padding:6vw}main{max-width:1100px;margin:auto}h1{font-size:clamp(30px,5vw,64px);letter-spacing:-.06em}section{background:white;border:1px solid #d5dfdc;border-radius:24px;padding:30px;margin:24px 0}button,a{font:inherit}button{border:0;border-radius:12px;background:#176c60;color:white;padding:13px 22px;margin:10px 12px 10px 0;cursor:pointer}button:disabled{opacity:.6;cursor:wait}textarea{width:100%;min-height:130px;font:16px monospace;padding:18px;border:1px solid #ccd5d2;border-radius:12px}pre{white-space:pre-wrap;font:16px system-ui}.status{display:inline-flex;align-items:center;gap:14px;min-height:60px}.dot{width:18px;height:18px;border-radius:50%;background:#4b75d3}.loading .dot{animation:breathe .8s ease-in-out infinite alternate}.success .dot{background:#168366}.error .dot{background:#ba543e}@keyframes breathe{to{transform:scale(.6);opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
<main><p>LOCAL INTERACTION STUDY · 原创概念组件</p><h1>从第一次连接，到每次回应。</h1><section><h2>START / 新手引导</h2><label for="csv">本地 CSV · 需要 name,value 两列</label><textarea id="csv">name,value
探索,12
构建,8
分享,5</textarea><p id="onStatus" aria-live="polite"></p><button id="next">导入样本</button><button id="reset">重新开始</button><pre id="result"></pre><a id="download" hidden>下载工作区 JSON</a></section>
<section><h2>READY / 可取消、可重试</h2><label><input type="checkbox" id="simulateError">模拟这次请求失败</label><p class="status idle" id="feedback" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="statusText">准备就绪</span></p><div><button id="run">开始</button><button id="cancel" disabled>取消</button></div></section><small>这个演示只在本地处理样本数据。产品、客户和服务均为概念示例。动画视频不能代替浏览器验收。</small></main>
<script type="module">
import {onboarding,feedback,initialFeedback} from './controller.mjs';
let s=onboarding({}, {type:'RESET'}),f={...initialFeedback},blobUrl;const el=id=>document.getElementById(id);
function drawStart(){el('onStatus').textContent=s.error||({choose:'01 选择数据',review:`已解析 ${s.rows.length} 行，请确认连接。`,scope:'02 访问范围：仅自己',done:'03 工作区已在本地生成'}[s.step]);el('next').textContent=({choose:'导入样本',review:'连接数据',scope:'创建工作区',done:'已完成'}[s.step]);el('next').disabled=s.step==='done';el('csv').hidden=s.step!=='choose';el('result').textContent=s.workspace?JSON.stringify(s.workspace,null,2):'';el('download').hidden=!s.workspace;if(blobUrl)URL.revokeObjectURL(blobUrl);if(s.workspace){blobUrl=URL.createObjectURL(new Blob([JSON.stringify(s.workspace,null,2)],{type:'application/json'}));el('download').href=blobUrl;el('download').download='first-workspace.json';}}
el('next').onclick=()=>{s=onboarding(s,{type:({choose:'IMPORT',review:'CONNECT',scope:'CREATE'}[s.step]),csv:el('csv').value});drawStart()};el('reset').onclick=()=>{s=onboarding(s,{type:'RESET'});drawStart()};drawStart();
function drawFeedback(){el('feedback').className='status '+f.status;el('statusText').textContent=({idle:'准备就绪',loading:'正在处理',success:'已完成',error:'连接失败，可以重试',cancelled:'已取消'}[f.status]);el('run').disabled=f.status==='loading';el('run').textContent=f.status==='error'?'重试':'开始';el('cancel').disabled=f.status!=='loading'}
el('run').onclick=()=>{f=feedback(f,{type:'START'});const request=f.request,failed=el('simulateError').checked;drawFeedback();setTimeout(()=>{f=feedback(f,{type:failed?'ERROR':'SUCCESS',request});drawFeedback()},1400)};el('cancel').onclick=()=>{f=feedback(f,{type:'CANCEL'});drawFeedback()};drawFeedback();
</script></html>
